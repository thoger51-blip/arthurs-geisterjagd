<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<title>Geister-Korb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Geister-Korb: Ball in den echten Korb werfen, auf dem Tablet "Treffer" tippen.
     Jeder Treffer fängt einen Geist ins Glas. Drei Geister im Glas = eine Aufgabe aus Arthis Schulheft.
     Gleiche Nacht-Welt wie Geisterjagd und Lesewelt. Lesetext immer in Andika (Schulschrift, einfaches a). */
  :root {
    --nacht: #1b2a4a;
    --nacht-hell: #2a3d66;
    --karte: #fffdf7;
    --tinte: #1d1a22;
    --gelb: #ffd34d;
    --gelb-dunkel: #b8871a;
    --geist: #6fd3ff;
    --gruen: #1f8a3c;
    --gruen-hell: #c6f2cf;
    --rot-hell: #ffd6dc;
    --bogen: #2d3a8c;
    --leise: #5f6474;
    --lesen: "Andika", "Comic Sans MS", system-ui, sans-serif;
    --anzeige: "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 0%, var(--nacht-hell) 0%, var(--nacht) 60%, #111a30 100%) fixed;
    color: #fff; font-family: var(--anzeige);
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; flex-direction: column; align-items: center;
  }
  button, a { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, a:focus-visible { outline: 4px solid var(--geist); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .seite { width: min(100%, 1040px); flex: 1; display: flex; flex-direction: column; gap: 14px; }

  .kopf { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .kopf h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); font-weight: 800; line-height: 1; text-wrap: balance; }
  .kopf .rechts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .klein { background: transparent; border: 2px solid rgba(255,255,255,.7); border-radius: 999px; padding: 5px 16px; font-weight: 800; font-size: 17px; color: #fff; text-decoration: none; }
  .erklaerung { margin: 0; font-size: clamp(16px, 2.6vw, 20px); color: #dfe6ff; max-width: 70ch; }
  .erklaerung b { color: var(--gelb); }

  /* Spieler-Karten */
  .spieler { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; flex: 1; align-content: start; }
  .spielerKarte {
    background: rgba(0,0,0,.28); border: 3px solid var(--farbe, var(--gelb)); border-radius: 24px; padding: 14px;
    display: flex; flex-direction: column; gap: 12px; align-items: stretch;
  }
  .spielerKopf { display: flex; align-items: center; gap: 10px; }
  .spielerName { font-size: clamp(26px, 4.5vw, 36px); font-weight: 800; color: var(--farbe); line-height: 1; }
  .muenzen { margin-left: auto; font-size: 24px; font-weight: 800; color: var(--gelb); font-variant-numeric: tabular-nums; }
  .glas {
    display: flex; justify-content: center; gap: 10px; padding: 10px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(159,220,255,.08), rgba(159,220,255,.2)); border: 3px solid rgba(159,220,255,.5);
  }
  .platz { width: clamp(64px, 11vw, 92px); aspect-ratio: 1; border-radius: 50%; border: 3px dashed rgba(255,255,255,.35); display: grid; place-items: center; }
  .platz svg { width: 82%; height: auto; }
  .platz.voll { border-style: solid; border-color: var(--geist); background: rgba(111, 211, 255, .15); }
  .platz.voll svg { animation: reinsaugen .55s cubic-bezier(.3,1.6,.5,1); }
  @keyframes reinsaugen { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .trefferKnopf {
    font: 800 clamp(28px, 5vw, 40px) var(--anzeige); color: var(--tinte); background: var(--gelb);
    border: 4px solid var(--tinte); border-radius: 22px; padding: 14px 10px; box-shadow: 0 7px 0 var(--gelb-dunkel); transition: transform .08s;
  }
  .trefferKnopf:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--gelb-dunkel); }
  .unterKnoepfe { display: flex; justify-content: space-between; gap: 8px; }
  .unterKnoepfe button { background: transparent; border: 2px solid rgba(255,255,255,.5); border-radius: 999px; color: #fff; padding: 3px 14px; font-size: 15px; font-weight: 700; }
  .unterKnoepfe .stufe.schwer { border-color: #ff9ccc; color: #ff9ccc; }

  /* Einstellungen */
  .einstellungen { background: rgba(0,0,0,.3); border-radius: 18px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .einstellungen label { font-weight: 700; font-size: 17px; }
  .einstellungen input[type=text] { font: 700 18px var(--anzeige); border-radius: 12px; border: 2px solid #fff; padding: 4px 10px; width: 9em; background: #fff; color: var(--tinte); }

  /* Aufgabe (legt sich über alles) */
  .aufgabeFenster { position: fixed; inset: 0; z-index: 10; background: rgba(10, 16, 32, .85); display: flex; align-items: center; justify-content: center; padding: 12px; }
  .karte {
    width: min(100%, 960px); max-height: 100%; overflow: auto; background: var(--karte); color: var(--tinte); border-radius: 26px; border: 4px solid var(--tinte);
    box-shadow: 0 8px 0 #0c1426; padding: clamp(12px, 3vw, 26px); display: flex; flex-direction: column; align-items: center;
    gap: clamp(10px, 2.5vh, 22px); text-align: center; position: relative;
  }
  .wer { font: 800 clamp(20px, 3.5vw, 28px) var(--anzeige); color: var(--farbe, #6b3d8a); }
  .anweisung { display: flex; align-items: center; gap: 10px; font: 800 clamp(17px, 3vw, 24px) var(--anzeige); color: #6b3d8a; }
  .anweisung button { border: 0; background: #efe4f7; border-radius: 999px; width: 40px; height: 40px; font-size: 20px; flex: none; }
  .lesetext { font-family: var(--lesen); font-weight: 700; font-size: clamp(38px, 8vw, 76px); line-height: 1.45; letter-spacing: .03em; }
  .lesetext.satz { font-size: clamp(28px, 5.5vw, 56px); }
  .wort { display: inline-block; white-space: nowrap; }
  .silbe { display: inline-block; padding: 0 .04em .08em; border-bottom: .07em solid var(--bogen); border-radius: 0 0 50% 50% / 0 0 .3em .3em; margin: 0 .02em; }
  .bildgross { font-size: clamp(70px, 15vw, 130px); line-height: 1; }
  .wahl { display: flex; gap: clamp(8px, 2.5vw, 20px); flex-wrap: wrap; justify-content: center; }
  .wahlKnopf {
    background: #fff; color: var(--tinte); border: 4px solid var(--tinte); border-radius: 20px; box-shadow: 0 6px 0 #b8a98c;
    font-family: var(--lesen); font-weight: 700; padding: 4px 14px; min-width: 64px;
  }
  .wahlKnopf.bild { font-size: clamp(40px, 8vw, 70px); min-width: clamp(90px, 18vw, 150px); line-height: 1.15; }
  .wahlKnopf.text { font-size: clamp(26px, 5vw, 44px); }
  .wahlKnopf.buchstabe { font-size: clamp(34px, 6.5vw, 56px); min-width: clamp(62px, 12vw, 96px); }
  .wahlKnopf.richtig { background: var(--gruen-hell); border-color: var(--gruen); box-shadow: 0 6px 0 var(--gruen); }
  .wahlKnopf.falsch { background: var(--rot-hell); animation: wackeln .35s; }
  .wahlKnopf.weg { visibility: hidden; }
  @keyframes wackeln { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .luecke { display: inline-block; min-width: .7em; margin: 0 .08em; border-bottom: .08em dashed #e0559a; color: #b83f81; }
  .kaestchen { display: flex; gap: clamp(4px, 1.2vw, 10px); justify-content: center; flex-wrap: wrap; }
  .kasten { width: clamp(46px, 9vw, 78px); height: clamp(58px, 11vw, 96px); border: 3px solid var(--tinte); border-radius: 12px; background: #fff;
            display: grid; place-items: center; font: 700 clamp(32px, 6.5vw, 58px) var(--lesen); }
  .kasten.jetzt { border-color: #e0559a; box-shadow: 0 0 0 4px rgba(224, 85, 154, .25); }
  .kasten.fertig { background: var(--gruen-hell); }
  .bauplatz { display: flex; gap: 6px; min-height: 1.6em; min-width: 3.5em; justify-content: center; font: 700 clamp(38px, 8vw, 70px) var(--lesen); border-bottom: 4px dashed #cfc3ad; padding: 0 12px; }
  .hilfe { font: 800 17px var(--anzeige); background: #fff; color: var(--tinte); border: 3px solid var(--tinte); border-radius: 999px; padding: 4px 16px; box-shadow: 0 4px 0 #b8a98c; }
  .lob { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
         background: rgba(255,253,247,.96); border-radius: 22px; font: 800 clamp(30px, 6vw, 50px) var(--anzeige); color: var(--gruen); }
  .lob .gross { font-size: clamp(70px, 14vw, 120px); }

  .ansage { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: rgba(10,16,32,.8); }
  .ansage div { font: 800 clamp(34px, 7vw, 64px) var(--anzeige); color: var(--gelb); text-align: center; animation: hereinpurzeln .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes hereinpurzeln { from { transform: scale(0) rotate(-20deg); } to { transform: scale(1); } }

  /* Arthi liest noch nur GROSSBUCHSTABEN (bei klein sehen I und l gleich aus) – darum alles Lese-Material in Großbuchstaben */
  .lesetext, .wahlKnopf, .kasten, .bauplatz, .luecke { text-transform: uppercase; }
  .lesetext { letter-spacing: .06em; }

  @media (max-height: 520px) {
    .karte { gap: 6px; padding: 10px; }
    .lesetext { font-size: min(9vw, 14vh); line-height: 1.25; }
    .lesetext.satz { font-size: min(6vw, 10vh); }
    .bildgross { font-size: min(14vw, 19vh); }
    .wahlKnopf.bild { font-size: min(8vw, 12vh); }
    .kasten { height: min(11vw, 15vh); width: min(9vw, 12vh); font-size: min(6.5vw, 9vh); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="seite">
  <div class="kopf">
    <h1>👻🏀 Geister-Korb</h1>
    <div class="rechts">
      <button class="klein" type="button" id="einstellKnopf">⚙ Spieler</button>
      <button class="klein" type="button" id="neuKnopf">↺ Neues Spiel</button>
      <a class="klein" href="./">👻 Zur Geisterjagd</a>
    </div>
  </div>
  <p class="erklaerung" id="erklaerung">Korb in die Mitte, Ball werfen! Bei jedem <b>Treffer</b> tippst du auf deinen Knopf – dann fliegt ein Geist in dein Glas.
    Sind <b>3 Geister</b> drin, kommt eine <b>Aufgabe</b>. Geschafft? Dann gibt es eine <b>Goldmünze</b>!</p>
  <div class="einstellungen" id="einstellungen" hidden></div>
  <div class="spieler" id="spieler"></div>
</main>

<div class="ansage" id="ansage" hidden><div id="ansageText"></div></div>

<div class="aufgabeFenster" id="fenster" hidden>
  <div class="karte" id="karte">
    <div class="wer" id="wer"></div>
    <div class="anweisung"><button type="button" id="nochmalSagen" aria-label="Anweisung nochmal hören">🔊</button><span id="anweisung"></span></div>
    <div id="aufgabe" style="display: contents"></div>
    <div class="lob" id="lob" hidden><span class="gross" id="lobBild">🪙</span><span id="lobText">Super!</span></div>
  </div>
</div>

<script>
// =====================================================================
//  Geister-Korb – Aufgaben aus Arthis Schulheft (Fibel)
//  Nur Buchstaben, die Arthi schon kennt: A a, M m, I i, O o, U u, N n, D d, R r, F f, T t, P p, L l, E e.
//  "|" trennt Silben (für die Silbenbögen).
// =====================================================================
const WOERTER = [
  ["Ma|ma", "👩"], ["Pa|pa", "👨"], ["O|pa", "👴"], ["O|ma", "👵"], ["La|ma", "🦙"], ["Nu|deln", "🍝"],
  ["En|te", "🦆"], ["Pan|da", "🐼"], ["To|ma|te", "🍅"], ["Tul|pe", "🌷"], ["Lam|pe", "💡"], ["Pfan|ne", "🍳"],
  ["U|fo", "🛸"], ["Am|pel", "🚦"], ["E|le|fant", "🐘"], ["Nil|pferd", "🦛"], ["Mond", "🌙"], ["No|te", "🎵"],
  ["Ra|di|o", "📻"], ["Pu|del", "🐩"], ["Lol|li", "🍭"], ["Fee", "🧚"], ["Tor", "🥅"], ["Pi|rat", "🏴‍☠️"],
  ["Pal|me", "🌴"], ["Me|lo|ne", "🍈"],
];
const LEICHT = ["Ma|ma", "Pa|pa", "O|pa", "O|ma", "La|ma", "U|fo", "Tor", "Mond", "Fee", "En|te", "No|te", "Pu|del"];
const SAETZE = [
  ["O|pa und O|ma.", "👴👵", ["👨👩", "👵👩"]], ["Ma|ma und Pa|pa.", "👩👨", ["👴👵", "👩👴"]],
  ["Ma|ma malt ein U|fo.", "👩🎨🛸", ["👩🎨🦆", "👩🎨🌙"]], ["O|pa malt ei|ne En|te.", "👴🎨🦆", ["👴🎨🛸", "👵🎨🦆"]],
  ["Pa|pa malt den Mond.", "👨🎨🌙", ["👨🎨🍅", "👩🎨🌙"]], ["Ein E|le|fant und ein Pan|da.", "🐘🐼", ["🐘🦙", "🦛🐼"]],
  ["Nu|deln und To|ma|ten.", "🍝🍅", ["🍳🍅", "🍝🍭"]], ["Ein Pi|rat und ein U|fo.", "🏴‍☠️🛸", ["🏴‍☠️🌙", "🧚🛸"]],
];
const STOLPER = [
  ["Li|na ruft li|la Lo|la.", 2], ["Ma|ma ruft und Ni|no.", 2], ["A|mi|na am ruft Mi|a an.", 1],
  ["Ni|na ruft im Pa|pa.", 2], ["O|pa U|fo ruft O|ma.", 1], ["Pa|pa malt Nu|deln ei|ne En|te.", 2],
  ["Ni|na No|te ruft Ni|no.", 1], ["Lo|la ruft Pan|da Mi|lan.", 2], ["O|ma malt Tor den Mond.", 2],
];
const BUCHSTABEN = "AMIOUNDRFTPLE".split("");

// Leichte Aufgaben (für Arthi) und schwere (für Papa, Mama …)
const ARTEN_LEICHT = ["luecke", "luecke", "schreiben", "schreiben", "silben", "wortbild"];
const ARTEN_SCHWER = ["schreiben", "schreiben", "luecke2", "stolper", "satzbild", "silben"];
const FARBEN = ["#ffd34d", "#6fd3ff", "#ff9ccc", "#9be37a"];
const GEISTER = 3;

// ---- Speichern (nur in diesem Browser) ----
function laden(n, sonst) { try { const w = localStorage.getItem("korb-" + n); return w === null ? sonst : JSON.parse(w); } catch (e) { return sonst; } }
function speichern(n, w) { try { localStorage.setItem("korb-" + n, JSON.stringify(w)); } catch (e) { /* egal */ } }
let spieler = laden("spieler", [
  { name: "Arthi", schwer: false, treffer: 0, muenzen: 0 },
  { name: "Thorsten", schwer: true, treffer: 0, muenzen: 0 },
]);
// Früher hieß der zweite Spieler "Papa" – jetzt "Thorsten"
spieler.forEach((s) => { if (s.name === "Papa") s.name = "Thorsten"; });
let stimmeAn = laden("stimme", true);

// ---- Helfer ----
const $ = (id) => document.getElementById(id);
const ohne = (t) => t.replace(/\|/g, "");
const zufall = (l) => l[Math.floor(Math.random() * l.length)];
function mischen(l) { l = l.slice(); for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; } return l; }
function silbenHtml(t) { return t.split(" ").map((w) => { const s = w.split("|"); return '<span class="wort">' + (s.length < 2 ? w : s.map((x) => '<span class="silbe">' + x + "</span>").join("")) + "</span>"; }).join(" "); }
function knopf(klasse, inhalt, html) { const k = document.createElement("button"); k.type = "button"; k.className = "wahlKnopf " + klasse; if (html) k.innerHTML = inhalt; else k.textContent = inhalt; return k; }
function el(tag, klasse, text) { const e = document.createElement(tag); if (klasse) e.className = klasse; if (text !== undefined) e.textContent = text; return e; }
function wackeln(k) { k.classList.remove("falsch"); void k.offsetWidth; k.classList.add("falsch"); }
const GEIST_SVG = '<svg viewBox="0 0 100 110" aria-hidden="true"><path d="M50 6C25 6 12 26 12 50v50l12-9 13 10 13-10 13 10 13-10 12 9V50C88 26 75 6 50 6Z" fill="#9fdcff" stroke="#111014" stroke-width="6" stroke-linejoin="round"/><ellipse cx="37" cy="45" rx="7" ry="9" fill="#111014"/><ellipse cx="63" cy="45" rx="7" ry="9" fill="#111014"/><path d="M38 63q12 11 24 0" fill="none" stroke="#111014" stroke-width="6" stroke-linecap="round"/></svg>';

// ---- Stimme (sagt nur die Anweisung, nie die Lösung – außer man drückt auf "Vorlesen") ----
function sagen(t, langsam) {
  if (!stimmeAn && !langsam) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "de-DE"; u.rate = langsam ? 0.65 : 0.9; speechSynthesis.speak(u); } catch (e) { /* egal */ }
}
// ---- Töne ----
let ton = null;
function tonAn() { try { if (!ton) ton = new (window.AudioContext || window.webkitAudioContext)(); if (ton.state === "suspended") ton.resume(); } catch (e) { /* egal */ } }
function piep(hz, d, s, form, laut) {
  if (!ton) return;
  try { const o = ton.createOscillator(), g = ton.createGain(), t = ton.currentTime + (s || 0); o.type = form || "triangle"; o.frequency.setValueAtTime(hz, t);
        g.gain.setValueAtTime(laut || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g); g.connect(ton.destination); o.start(t); o.stop(t + d + 0.05); } catch (e) { /* egal */ }
}
function schluerfTon() {
  if (!ton) return;
  try { const o = ton.createOscillator(), g = ton.createGain(), t = ton.currentTime; o.type = "sine"; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(160, t + 0.35);
        g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4); o.connect(g); g.connect(ton.destination); o.start(t); o.stop(t + 0.45); } catch (e) { /* egal */ }
}
const richtigTon = () => { piep(523, 0.14); piep(659, 0.14, 0.12); piep(784, 0.3, 0.24); };
const falschTon = () => piep(200, 0.3, 0, "sawtooth", 0.1);
const klickTon = () => piep(880, 0.08, 0, "triangle", 0.1);
const muenzTon = () => [988, 1319].forEach((h, i) => piep(h, 0.25, i * 0.09, "square", 0.08));
const aufgabeTon = () => [392, 523, 659, 784].forEach((h, i) => piep(h, 0.16, i * 0.1));

// =====================================================================
//  Spieler und Treffer
// =====================================================================
function spielerZeigen() {
  const feld = $("spieler"); feld.innerHTML = "";
  spieler.forEach((s, i) => {
    const karte = el("div", "spielerKarte"); karte.style.setProperty("--farbe", FARBEN[i % FARBEN.length]);
    const kopf = el("div", "spielerKopf");
    kopf.append(el("span", "spielerName", s.name), el("span", "muenzen", "🪙 " + s.muenzen));
    const glas = el("div", "glas"); glas.setAttribute("aria-label", s.treffer + " von " + GEISTER + " Geistern im Glas");
    for (let g = 0; g < GEISTER; g++) { const p = el("div", "platz" + (g < s.treffer ? " voll" : "")); if (g < s.treffer) p.innerHTML = GEIST_SVG; glas.appendChild(p); }
    const k = el("button", "trefferKnopf", "🏀 Treffer!"); k.type = "button";
    k.addEventListener("click", () => treffer(i));
    const unten = el("div", "unterKnoepfe");
    const zurueck = el("button", "", "↶ Doch kein Treffer"); zurueck.type = "button";
    zurueck.addEventListener("click", () => { if (s.treffer > 0) { s.treffer--; speichern("spieler", spieler); spielerZeigen(); } });
    const stufe = el("button", "stufe" + (s.schwer ? " schwer" : ""), s.schwer ? "Aufgaben: schwer" : "Aufgaben: leicht"); stufe.type = "button";
    stufe.addEventListener("click", () => { s.schwer = !s.schwer; speichern("spieler", spieler); spielerZeigen(); });
    unten.append(zurueck, stufe);
    karte.append(kopf, glas, k, unten);
    feld.appendChild(karte);
  });
}
function treffer(i) {
  tonAn();
  const s = spieler[i];
  s.treffer = Math.min(GEISTER, s.treffer + 1);
  speichern("spieler", spieler);
  schluerfTon();
  spielerZeigen();
  if (s.treffer >= GEISTER) {
    aufgabeTon();
    ansage("👻👻👻<br>" + s.name + " hat 3 Geister!<br>Aufgabe!", s.name + " hat drei Geister gefangen! Jetzt kommt eine Aufgabe!");
    setTimeout(() => aufgabeStarten(i), 1900);
  }
}
function ansage(html, sprich) {
  $("ansageText").innerHTML = html; $("ansage").hidden = false; sagen(sprich);
  setTimeout(() => { $("ansage").hidden = true; }, 1800);
}
$("neuKnopf").addEventListener("click", () => { spieler.forEach((s) => { s.treffer = 0; s.muenzen = 0; }); speichern("spieler", spieler); spielerZeigen(); });

// ---- Spieler einstellen ----
$("einstellKnopf").addEventListener("click", () => {
  const e = $("einstellungen");
  if (!e.hidden) { e.hidden = true; return; }
  e.innerHTML = "";
  spieler.forEach((s, i) => {
    const id = "name" + i;
    const l = el("label", "", "Spieler " + (i + 1) + ":"); l.htmlFor = id;
    const inp = document.createElement("input"); inp.type = "text"; inp.id = id; inp.value = s.name; inp.maxLength = 12;
    inp.addEventListener("input", () => { s.name = inp.value.trim() || "Spieler " + (i + 1); speichern("spieler", spieler); spielerZeigen(); });
    e.append(l, inp);
    if (spieler.length > 1) { const w = el("button", "klein", "✕"); w.type = "button"; w.setAttribute("aria-label", "Spieler entfernen");
      w.addEventListener("click", () => { spieler.splice(i, 1); speichern("spieler", spieler); spielerZeigen(); e.hidden = true; $("einstellKnopf").click(); }); e.appendChild(w); }
  });
  if (spieler.length < 4) { const plus = el("button", "klein", "+ Spieler"); plus.type = "button";
    plus.addEventListener("click", () => { spieler.push({ name: "Mama", schwer: true, treffer: 0, muenzen: 0 }); speichern("spieler", spieler); spielerZeigen(); e.hidden = true; $("einstellKnopf").click(); }); e.appendChild(plus); }
  const st = el("button", "klein", "🔊 Stimme: " + (stimmeAn ? "an" : "aus")); st.type = "button";
  st.addEventListener("click", () => { stimmeAn = !stimmeAn; speichern("stimme", stimmeAn); st.textContent = "🔊 Stimme: " + (stimmeAn ? "an" : "aus"); });
  e.appendChild(st);
  e.hidden = false;
});

// =====================================================================
//  Die Aufgaben
// =====================================================================
let aufgabe = null, wer = 0, fehler = 0, zuletzt = [];
function neu(liste, key) {
  for (let i = 0; i < 30; i++) { const x = zufall(liste); if (!zuletzt.includes(key(x))) { zuletzt = [key(x), ...zuletzt].slice(0, 10); return x; } }
  return zufall(liste);
}
function aufgabeStarten(i) {
  wer = i; fehler = 0;
  const s = spieler[i];
  $("karte").style.setProperty("--farbe", FARBEN[i % FARBEN.length]);
  $("wer").textContent = "Aufgabe für " + s.name;
  $("lob").hidden = true;
  const feld = $("aufgabe"); feld.innerHTML = "";
  const art = zufall(s.schwer ? ARTEN_SCHWER : ARTEN_LEICHT);
  ({ luecke: () => aufgabeLuecke(feld, 1, s.schwer), luecke2: () => aufgabeLuecke(feld, 2, true), schreiben: () => aufgabeSchreiben(feld, s.schwer),
     silben: () => aufgabeSilben(feld, s.schwer), wortbild: () => aufgabeWortBild(feld), satzbild: () => aufgabeSatzBild(feld),
     stolper: () => aufgabeStolper(feld) })[art]();
  $("fenster").hidden = false;
  sagen(aufgabe.sag);
}
function anweisung(text, sag) { $("anweisung").textContent = text; aufgabe.sag = sag; }
$("nochmalSagen").addEventListener("click", () => { if (aufgabe) sagen(aufgabe.sag, false); });
function pool(schwer) { return schwer ? WOERTER : WOERTER.filter((w) => LEICHT.includes(w[0])); }
function hilfeKnopf(feld, text) {
  const h = el("button", "hilfe", "🔊 Vorlesen lassen"); h.type = "button"; h.hidden = true;
  h.addEventListener("click", () => sagen(text, true));
  feld.appendChild(h); aufgabe.hilfe = () => { h.hidden = false; };
}
function falsch(k) { fehler++; falschTon(); if (k) wackeln(k); if (fehler === 2 && aufgabe.hilfe) aufgabe.hilfe(); }
function geschafft() {
  if (!aufgabe || aufgabe.fertig) return;
  aufgabe.fertig = true;
  richtigTon(); setTimeout(muenzTon, 350);
  const s = spieler[wer];
  s.muenzen++; s.treffer = 0; speichern("spieler", spieler);
  $("lobText").textContent = zufall(["Super, " + s.name + "!", "Klasse gemacht!", "Toll, " + s.name + "!", "Genau richtig!"]) + " Eine Goldmünze!";
  $("lob").hidden = false;
  sagen($("lobText").textContent);
  setTimeout(() => { $("fenster").hidden = true; aufgabe = null; spielerZeigen(); }, 2300);
}

// ---- Buchstabe fehlt (wie "No··" im Heft) ----
function aufgabeLuecke(feld, wieviele, schwer) {
  const [wort, bild] = neu(pool(schwer).filter((w) => ohne(w[0]).length >= 3), (x) => x[0]);
  const ganz = ohne(wort);
  const stellen = mischen([...ganz].map((_, i) => i)).slice(0, Math.min(wieviele, ganz.length - 1)).sort((a, b) => a - b);
  aufgabe = { stellen, jetzt: 0, ganz };
  anweisung(wieviele > 1 ? "Welche Buchstaben fehlen?" : "Welcher Buchstabe fehlt?", "Schau das Bild an. Welcher Buchstabe fehlt im Wort?");
  feld.appendChild(el("div", "bildgross", bild));
  const t = el("div", "lesetext");
  t.innerHTML = [...ganz].map((c, i) => (stellen.includes(i) ? '<span class="luecke" data-i="' + i + '">&nbsp;</span>' : c)).join("");
  feld.appendChild(t);
  const w = el("div", "wahl"); feld.appendChild(w);
  function zeigeWahl() {
    w.innerHTML = "";
    const i = stellen[aufgabe.jetzt], richtig = ganz[i], gross = richtig === richtig.toUpperCase();
    const falsche = mischen(BUCHSTABEN.filter((b) => b.toLowerCase() !== richtig.toLowerCase())).slice(0, 3).map((b) => (gross ? b : b.toLowerCase()));
    for (const c of mischen([richtig, ...falsche])) {
      const k = knopf("buchstabe", c);
      k.addEventListener("click", () => {
        if (c !== richtig) { falsch(k); return; }
        klickTon(); const l = t.querySelector('[data-i="' + i + '"]'); l.textContent = c; l.style.borderBottomStyle = "solid";
        aufgabe.jetzt++;
        if (aufgabe.jetzt >= stellen.length) { k.classList.add("richtig"); geschafft(); } else zeigeWahl();
      });
      w.appendChild(k);
    }
  }
  zeigeWahl();
  hilfeKnopf(feld, ganz);
}

// ---- Wort schreiben: Buchstaben in die Kästchen tippen ----
function aufgabeSchreiben(feld, schwer) {
  const [wort, bild] = neu(pool(schwer), (x) => x[0]);
  const ganz = ohne(wort);
  aufgabe = { jetzt: 0 };
  anweisung("Schreib das Wort!", "Schau das Bild an. Schreib das Wort. Tipp die Buchstaben der Reihe nach an!");
  feld.appendChild(el("div", "bildgross", bild));
  const reihe = el("div", "kaestchen"); feld.appendChild(reihe);
  const kaesten = [...ganz].map((_, i) => { const k = el("div", "kasten" + (i === 0 ? " jetzt" : "")); reihe.appendChild(k); return k; });
  // Buchstaben-Knöpfe: alle aus dem Wort (doppelte nur einmal) plus ein paar falsche
  const im = [...new Set(ganz.toLowerCase())];
  const extra = mischen(BUCHSTABEN.map((b) => b.toLowerCase()).filter((b) => !im.includes(b))).slice(0, schwer ? 4 : 2);
  const w = el("div", "wahl"); feld.appendChild(w);
  for (const c of mischen([...im, ...extra])) {
    const k = knopf("buchstabe", c);
    k.addEventListener("click", () => {
      const soll = ganz[aufgabe.jetzt];
      if (c !== soll.toLowerCase()) { falsch(k); return; }
      klickTon();
      const kasten = kaesten[aufgabe.jetzt];
      kasten.textContent = soll; kasten.classList.remove("jetzt"); kasten.classList.add("fertig");
      aufgabe.jetzt++;
      if (aufgabe.jetzt >= ganz.length) geschafft(); else kaesten[aufgabe.jetzt].classList.add("jetzt");
    });
    w.appendChild(k);
  }
  hilfeKnopf(feld, ganz);
}

// ---- Silben bauen ----
function aufgabeSilben(feld, schwer) {
  const [wort, bild] = neu(pool(schwer).filter((w) => w[0].includes("|")), (x) => x[0]);
  const silben = wort.split("|");
  let reihe = mischen(silben.map((s, i) => ({ s, i })));
  if (reihe.every((x, i) => x.i === i)) reihe = reihe.reverse();
  aufgabe = { als: 0 };
  anweisung("Bau das Wort aus den Silben!", "Schau das Bild an. Tipp die Silben in der richtigen Reihenfolge an!");
  feld.appendChild(el("div", "bildgross", bild));
  const platz = el("div", "bauplatz"); feld.appendChild(platz);
  const w = el("div", "wahl"); feld.appendChild(w);
  for (const { s, i } of reihe) {
    const k = knopf("text", s);
    k.addEventListener("click", () => {
      if (i !== aufgabe.als) { falsch(k); return; }
      klickTon(); k.classList.add("weg"); platz.appendChild(el("span", "silbe", s));
      aufgabe.als++; if (aufgabe.als === silben.length) geschafft();
    });
    w.appendChild(k);
  }
  hilfeKnopf(feld, ohne(wort));
}

// ---- Wort und Bild / Satz und Bild ----
function bilderWahl(feld, richtig, falsche) {
  const w = el("div", "wahl");
  for (const b of mischen([richtig, ...falsche])) {
    const k = knopf("bild", b);
    k.addEventListener("click", () => (b === richtig ? (k.classList.add("richtig"), geschafft()) : falsch(k)));
    w.appendChild(k);
  }
  feld.appendChild(w);
}
function aufgabeWortBild(feld) {
  const [wort, bild] = neu(pool(false), (x) => x[0]);
  aufgabe = {};
  anweisung("Lies das Wort – welches Bild passt?", "Lies das Wort. Welches Bild passt?");
  const t = el("div", "lesetext"); t.innerHTML = silbenHtml(wort); feld.appendChild(t);
  bilderWahl(feld, bild, mischen(WOERTER.filter((x) => x[1] !== bild)).slice(0, 2).map((x) => x[1]));
  hilfeKnopf(feld, ohne(wort));
}
function aufgabeSatzBild(feld) {
  const [satz, bild, falsche] = neu(SAETZE, (x) => x[0]);
  aufgabe = {};
  anweisung("Lies den Satz – welches Bild passt?", "Lies den Satz. Welches Bild passt?");
  const t = el("div", "lesetext satz"); t.innerHTML = silbenHtml(satz); feld.appendChild(t);
  bilderWahl(feld, bild, falsche);
  hilfeKnopf(feld, ohne(satz));
}
// ---- Stolper-Wort ----
function aufgabeStolper(feld) {
  const [satz, i0] = neu(STOLPER, (x) => x[0]);
  aufgabe = {};
  anweisung("Ein Wort passt nicht – tipp es an!", "Lies den Satz. Ein Wort passt nicht hinein. Tipp es an!");
  const w = el("div", "wahl");
  satz.replace(/\.$/, "").split(" ").forEach((x, i) => {
    const k = knopf("text", silbenHtml(x), true);
    k.addEventListener("click", () => (i === i0 ? (k.classList.add("richtig"), geschafft()) : falsch(k)));
    w.appendChild(k);
  });
  feld.appendChild(w);
  hilfeKnopf(feld, ohne(satz));
}

spielerZeigen();
</script>
